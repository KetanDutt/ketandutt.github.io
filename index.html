<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        :root {
            --primary-color: #6e48aa;
            --secondary-color: #9d50bb;
            --dark-color: #1a1a2e;
            --light-color: #f8f9fa;
            --accent-color: #ff6b6b;
            --bg-color: var(--dark-color);
            --text-color: var(--light-color);
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        [data-theme="light"] {
            --primary-color: #6e48aa;
            --secondary-color: #9d50bb;
            --dark-color: #1a1a2e;
            --light-color: #333;
            --accent-color: #ff6b6b;
            --bg-color: #f8f9fa;
            --text-color: #333;
            --card-bg: rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            position: relative;
        }

        /* Interactive Background */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: linear-gradient(135deg, var(--dark-color) 0%, #16213e 100%);
            will-change: transform;
        }

        /* Game UI Elements */
        .hud-corner {
            width: 120px;
            height: 120px;
            border: 3px solid rgba(110, 72, 170, 0.5);
            position: fixed;
            pointer-events: none;
            z-index: 100;
        }

        .hud-top-left {
            top: 15px;
            left: 15px;
            border-right: none;
            border-bottom: none;
            border-radius: 15px 0 0 0;
        }

        .hud-top-right {
            top: 15px;
            right: 15px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 15px 0 0;
        }

        .hud-bottom-left {
            bottom: 15px;
            left: 15px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 15px;
        }

        .hud-bottom-right {
            bottom: 15px;
            right: 15px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 15px 0;
        }

        /* Profile Section */
        .profile-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--primary-color);
            box-shadow: 0 10px 30px rgba(110, 72, 170, 0.5);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .profile-container:hover .profile-img {
            transform: scale(1.1);
        }

        /* Section Headers */
        .section-header {
            position: relative;
            margin-bottom: 2rem;
            display: inline-block;
        }

        .section-header::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 2px;
        }

        /* Experience Cards */
        .experience-card {
            background: var(--card-bg);
            border-left: 4px solid var(--primary-color);
            border-radius: 8px;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
            will-change: transform, box-shadow;

            color: var(--text-color);
        }

        .experience-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--accent-color);
        }

        .company-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 8px;
            background: white;
            padding: 5px;
        }

        /* Skill Bars */
        .skill-bar-container {
            margin-bottom: 1rem;
        }

        .skill-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .skill-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .skill-progress {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 4px;
        }

        /* Stats Section */
        .stat-icon {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Game Project Cards */
        .game-thumbnail {
            height: 200px;
            background-size: cover;
            background-position: center;
            border-radius: 8px 8px 0 0;
        }

        /* Console Loader */
        #console-loader {
            transition: opacity 0.5s ease-out;
        }

        .console-animation {
            width: 80px;
            height: 80px;
            border: 5px solid var(--primary-color);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        .row {
            justify-content: center;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .z-index-9999 {
            z-index: 9999;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .hud-corner {
                width: 80px;
                height: 80px;
            }

            .profile-container {
                width: 240px;
                height: 240px;
            }
        }
    </style>
</head>

<body>
    <!-- Console Loader -->
    <div id="console-loader"
        class="d-flex justify-content-center align-items-center position-fixed top-0 start-0 w-100 h-100 bg-dark z-index-9999">
        <div class="text-center" style="display: flex;flex-direction: column;align-items: center;">
            <div class="console-animation mb-3"></div>
            <p class="text-white">Loading portfolio...</p>
        </div>
    </div>

    <!-- Interactive Background -->
    <div id="particles-js"></div>

    <!-- Game UI Elements -->
    <div class="hud-corner hud-top-left"></div>
    <div class="hud-corner hud-top-right"></div>
    <div class="hud-corner hud-bottom-left"></div>
    <div class="hud-corner hud-bottom-right"></div>

    <!-- Theme Toggle -->
    <button id="themeToggle" class="btn btn-sm"
        style="position: fixed;left: 20px;top: 20px;z-index: 90; display: none;">
        <i class="fas fa-moon  fa-2x"></i>
    </button>

    <button id="downloadCV" class="btn hud-corner" style="position: fixed;right: 12px;top: 20px;z-index: 90; border: none;pointer-events: all; display: none;">
        <img src="CV.png" alt="Download CV" style="width: 100%;">
    </button>
    <!-- Main Content -->

    <div class="container py-5">
        <!-- Hero Section -->
        <section class="row text-center py-5" id="hero-section">
            <div class="col-md-4" style="min-width: 300px;">
                <div class="profile-container">
                    <img id="profile-img" src="" alt="" class="profile-img">
                </div>
            </div>
            <div class="col-md-8">
                <h1 class="display-4 fw-bold mt-4 mb-2" id="profile-name"></h1>
                <h2 class="h5  mb-4" id="profile-badges">
                    <!-- Badges injected here -->
                </h2>
                <h3 class="h5 mb-4" id="profile-subtitle"></h3>
                <div class="social-links" id="social-links" style="display: flex !important;justify-content: space-evenly !important;align-content: center;">
                     <!-- Social links injected here -->
                </div>
            </div>
        </section>

        <!-- Current Focus Section -->
        <section class="py-4">
            <h2 class="section-header">Current Focus</h2>
            <div class="card experience-card p-4">
                <div class="row" id="current-focus-container">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </section>

        <!-- Summary Section -->
        <section class="py-4">
            <h2 class="section-header">Summary</h2>
            <div class="card experience-card p-4">
                <p class="mb-0" id="summary-text"></p>
            </div>
        </section>

        <!-- Experience Section -->
        <section class="py-4">
            <h2 class="section-header">Experience</h2>
            <div id="experience-container">
                <!-- Dynamic Content -->
            </div>
        </section>

        <!-- Skills Section -->
        <section class="py-4">
            <h2 class="section-header">Skills</h2>

            <div class="row">
                <div class="col-md-6">
                    <div class="card experience-card p-4 h-100">
                        <h3 class="h5 mb-3">Game Engines</h3>
                        <div id="skills-game-engines">
                            <!-- Dynamic -->
                        </div>
                    </div>
                </div>

                <div class="col-md-6 mt-4 mt-md-0">
                    <div class="card experience-card p-4 h-100">
                        <h3 class="h5 mb-3">Programming Languages</h3>
                        <div id="skills-languages">
                            <!-- Dynamic -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Skills Radar Chart -->
            <div class="row mt-4">
                <div class="col-md-6">
                    <div class="card experience-card p-4">
                        <h3 class="h5 mb-3">Skills Radar Chart</h3>
                        <canvas id="skillsRadar" height="400"></canvas>
                    </div>
                </div>
            </div>
        </section>

        <!-- Toolbox Section -->
        <section class="py-4">
            <h2 class="section-header">Development Toolbox</h2>
            <div class="row" id="toolbox-container">
                <!-- Dynamic Content -->
            </div>
        </section>

        <!-- Demo Projects Section -->
        <section class="py-4">
            <h2 class="section-header">Demo Projects</h2>

            <div class="row" id="projects-container">
                 <!-- Dynamic Content -->
            </div>

            <div class="text-center mt-3">
                <button class="btn btn-outline-light" id="showMoreProjects" style="display: none;">Show More Projects</button>
            </div>

            <div id="moreProjects" class="row mt-3" style="display: none;">
                 <!-- Dynamic Content -->
            </div>
        </section>

        <!-- Stats Section -->
        <section class="py-4">
            <h2 class="section-header">Game Dev Stats</h2>
            <div class="row text-center" id="stats-container">
                 <!-- Dynamic Content -->
            </div>
        </section>

        <!-- Awards Section -->
        <section class="py-4">
            <h2 class="section-header">Awards</h2>
            <div id="awards-container">
                 <!-- Dynamic Content -->
            </div>
        </section>

        <!-- Education Section -->
        <section class="py-4">
            <h2 class="section-header">Education</h2>
            <div id="education-container">
                 <!-- Dynamic Content -->
            </div>
        </section>

        <!-- Contact Section -->
        <section class="py-4">
            <h2 class="section-header">Contact Me</h2>

            <div class="row p-3">
                <div class="col-md-6" style="display: none;">
                    <div class="card experience-card p-4 h-100">
                        <form id="contactForm">
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control bg-transparent text-white" id="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control bg-transparent text-white" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label">Message</label>
                                <textarea class="form-control bg-transparent text-white" id="message" rows="4"
                                    required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-paper-plane me-2"></i>Send Message
                            </button>
                        </form>
                    </div>
                </div>

                <div class="col-md-12 mt-4 mt-md-0">
                    <div class=" experience-card p-4 h-100 row" id="contact-outer-container">
                         <div class="col-md-6">
                            <h3 class="h5 mb-3">Direct Contact</h3>
                            <ul class="list-unstyled" id="contact-info-list">
                                <!-- Dynamic -->
                            </ul>
                        </div>
                        <div class="col-md-6">
                             <div class="social-links row" id="contact-social-links" style="display: flex;justify-content: space-around;align-items: center;flex-direction: row;align-content: space-around;height: 100%;">
                                <!-- Dynamic -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // Load Configuration
        fetch('config.json')
            .then(response => response.json())
            .then(config => {
                initializePortfolio(config);
            })
            .catch(error => {
                console.error('Error loading config:', error);
                document.getElementById('console-loader').innerHTML = '<p class="text-white text-center">Error loading configuration.<br>Please check console.</p>';
            });

        function initializePortfolio(config) {
            // Meta & Theme
            document.title = config.meta.title;
            const root = document.documentElement;
            for (const [key, value] of Object.entries(config.theme.colors)) {
                root.style.setProperty(`--${key}-color`, value);
            }

            // CV Download Button
            const downloadBtn = document.getElementById('downloadCV');
            if (config.settings.show_cv_download) {
                downloadBtn.style.display = 'block';
                downloadBtn.onclick = () => {
                     setTimeout(() => {
                        const link = document.createElement('a');
                        link.href = config.settings.cv_file_path;
                        link.download = config.settings.cv_file_path;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    }, 500);
                };
            }

            // Profile
            document.getElementById('profile-img').src = config.profile.image_url;
            document.getElementById('profile-img').alt = config.profile.name;
            document.getElementById('profile-name').textContent = config.profile.name;
            document.getElementById('profile-subtitle').textContent = config.profile.subtitle;

            const badgesContainer = document.getElementById('profile-badges');
            config.profile.badges.forEach(badge => {
                const span = document.createElement('span');
                span.className = `badge ${badge.color_class} me-1`;
                span.textContent = badge.text;
                badgesContainer.appendChild(span);
            });

            const renderSocialLinks = (containerId, classNames = "text-white") => {
                 const container = document.getElementById(containerId);
                 container.innerHTML = '';
                 config.profile.social_links.forEach(link => {
                    const a = document.createElement('a');
                    a.href = link.url;
                    a.target = "_blank";
                    a.className = classNames;
                    if(containerId === 'contact-social-links') a.className += " col-6";
                    a.style.textDecoration = "none";
                    a.innerHTML = `<i class="${link.icon} fa-3x"></i>`;
                    container.appendChild(a);
                 });
            };
            renderSocialLinks('social-links');
            renderSocialLinks('contact-social-links');


            // Current Focus
            const focusContainer = document.getElementById('current-focus-container');
            config.current_focus.forEach(item => {
                const col = document.createElement('div');
                col.className = 'col-md-6';
                col.innerHTML = `
                    <div class="d-flex align-items-center mb-3">
                        <i class="${item.icon} fa-2x text-primary me-3"></i>
                        <div>
                            <h3 class="h5 mb-1">${item.title}</h3>
                            <p class="mb-0">${item.text}</p>
                        </div>
                    </div>
                `;
                focusContainer.appendChild(col);
            });

            // Summary
            document.getElementById('summary-text').textContent = config.summary;

            // Experience
            const expContainer = document.getElementById('experience-container');
            config.experience.forEach(job => {
                const card = document.createElement('div');
                card.className = 'card experience-card p-4';

                const listItems = job.description.map(desc => `<li>${desc.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</li>`).join('');

                card.innerHTML = `
                    <div class="d-flex align-items-start mb-3">
                        <img src="${job.logo}" alt="${job.company}" class="company-logo me-3" loading="lazy">
                        <div>
                            <h3 class="h5 mb-1">${job.role}</h3>
                            <div class="d-flex flex-wrap align-items-center mb-2">
                                <span class="me-3">${job.company}</span>
                                <span class="me-3"><i class="fas fa-map-marker-alt me-1"></i> ${job.location}</span>
                                <span><i class="fas fa-calendar-alt me-1"></i> ${job.period}</span>
                            </div>
                        </div>
                    </div>
                    <ul>${listItems}</ul>
                `;
                expContainer.appendChild(card);
            });

            // Skills
            const renderSkillBars = (containerId, skills) => {
                const container = document.getElementById(containerId);
                skills.forEach(skill => {
                    const div = document.createElement('div');
                    div.className = 'skill-bar-container';
                    let badgesHtml = '';
                    if (skill.tags) {
                        badgesHtml = '<div class="mt-2">' + skill.tags.map(tag => `<span class="badge bg-secondary me-1 mb-1">${tag}</span>`).join('') + '</div>';
                    }
                    div.innerHTML = `
                        <div class="skill-label">
                            <span>${skill.name}</span>
                            <span>${skill.level}</span>
                        </div>
                        <div class="skill-bar">
                            <div class="skill-progress" style="width: ${skill.percentage}%"></div>
                        </div>
                        ${badgesHtml}
                    `;
                    container.appendChild(div);
                });
            };
            renderSkillBars('skills-game-engines', config.skills.game_engines);
            renderSkillBars('skills-languages', config.skills.programming_languages);

            // Radar Chart
            const ctx = document.getElementById('skillsRadar').getContext('2d');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: config.skills.radar_chart.labels,
                    datasets: [{
                        label: 'Skill Level',
                        data: config.skills.radar_chart.data,
                        backgroundColor: 'rgba(110, 72, 170, 0.2)',
                        borderColor: 'rgba(110, 72, 170, 1)',
                        borderWidth: 2,
                        pointBackgroundColor: 'rgba(110, 72, 170, 1)',
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        r: {
                            min: 0,
                            max: 100,
                            angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            pointLabels: { color: '#fff', font: { size: 12 } },
                            ticks: { display: false }
                        }
                    },
                    plugins: { legend: { labels: { color: '#fff' } } }
                }
            });

            // Toolbox
            const toolboxContainer = document.getElementById('toolbox-container');
            const renderToolboxCategory = (title, items) => {
                const col = document.createElement('div');
                col.className = 'col-md-4 mb-4';
                const itemsHtml = items.map(item => {
                    let iconHtml = '';
                    if (item.icon_url) {
                        iconHtml = `<img src="${item.icon_url}" width="20" height="20" class="me-1" loading="lazy">`;
                    } else if (item.icon_class) {
                        iconHtml = `<i class="${item.icon_class} me-1"></i>`;
                    }
                    return `<span class="badge bg-secondary p-2 d-flex align-items-center">${iconHtml} ${item.name}</span>`;
                }).join('');

                col.innerHTML = `
                    <div class="card experience-card p-4 h-100">
                        <h3 class="h5 mb-3">${title}</h3>
                        <div class="d-flex flex-wrap gap-2">${itemsHtml}</div>
                    </div>
                `;
                toolboxContainer.appendChild(col);
            };
            renderToolboxCategory("Game Engines", config.toolbox.game_engines);
            renderToolboxCategory("Languages", config.toolbox.languages);
            renderToolboxCategory("Tools & Platforms", config.toolbox.tools);


            // Projects
            const projectsContainer = document.getElementById('projects-container');
            const moreProjectsContainer = document.getElementById('moreProjects');
            const showMoreBtn = document.getElementById('showMoreProjects');
            let hiddenProjectsCount = 0;

            config.projects.forEach(project => {
                const col = document.createElement('div');
                col.className = 'col-md-6 mb-4';

                const techBadges = project.technologies.map(t => `<span class="badge bg-secondary me-1">${t}</span>`).join('');

                col.innerHTML = `
                    <div class="card experience-card h-100">
                        <div class="card-body">
                            <h3 class="h5">${project.title}</h3>
                            <p class="small">${project.subtitle}</p>
                            <p class="mb-3">${project.description}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <div>${techBadges}</div>
                                <div>
                                    <a href="${project.demo_link}" target="_blank" class="btn btn-sm btn-outline-light me-1"><i class="fas fa-external-link-alt me-1"></i>Demo</a>
                                    <a href="${project.source_link}" target="_blank" class="btn btn-sm btn-outline-light"><i class="fab fa-github me-1"></i>Source</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                if (project.hidden_initially) {
                    moreProjectsContainer.appendChild(col);
                    hiddenProjectsCount++;
                } else {
                    projectsContainer.appendChild(col);
                }
            });

            if (hiddenProjectsCount > 0) {
                showMoreBtn.style.display = 'inline-block';
                showMoreBtn.addEventListener('click', function() {
                    if (moreProjectsContainer.style.display === 'none') {
                        moreProjectsContainer.style.display = 'flex';
                        this.textContent = 'Show Less Projects';
                    } else {
                        moreProjectsContainer.style.display = 'none';
                        this.textContent = 'Show More Projects';
                    }
                });
            }

            // Stats
            const statsContainer = document.getElementById('stats-container');
            config.stats.forEach(stat => {
                const col = document.createElement('div');
                col.className = 'col-md-3 col-6 mb-4';
                col.innerHTML = `
                    <div class="card experience-card p-3 h-100">
                        <div class="stat-icon mb-2">
                            <i class="${stat.icon} fa-3x text-primary"></i>
                        </div>
                        <h3 class="h4 mb-0 counter" data-target="${stat.value}">${stat.value}</h3>
                        <p class="mb-0">${stat.label}</p>
                    </div>
                `;
                statsContainer.appendChild(col);
            });
            // Init counters
            initCounters();

            // Awards
            const awardsContainer = document.getElementById('awards-container');
            config.awards.forEach(award => {
                const card = document.createElement('div');
                card.className = 'card experience-card p-4';
                card.innerHTML = `
                    <div class="d-flex align-items-start">
                        <div class="me-4"><i class="${award.icon} fa-3x ${award.icon_color}"></i></div>
                        <div>
                            <h3 class="h5 mb-1">${award.title}</h3>
                            <div class="d-flex flex-wrap align-items-center mb-2">
                                <span class="me-3">${award.company}</span>
                                <span><i class="fas fa-calendar-alt me-1"></i> ${award.date}</span>
                            </div>
                            <p class="mb-0">${award.description}</p>
                        </div>
                    </div>
                `;
                awardsContainer.appendChild(card);
            });

            // Education
            const eduContainer = document.getElementById('education-container');
            config.education.forEach(edu => {
                 const card = document.createElement('div');
                card.className = 'card experience-card p-4';
                card.innerHTML = `
                    <div class="d-flex align-items-start">
                        <div class="me-4"><i class="${edu.icon} fa-3x text-primary"></i></div>
                        <div>
                            <h3 class="h5 mb-1">${edu.title}</h3>
                            <div class="d-flex flex-wrap align-items-center mb-2">
                                <span class="me-3">${edu.institution}</span>
                                <span><i class="fas fa-calendar-alt me-1"></i> ${edu.period}</span>
                            </div>
                        </div>
                    </div>
                `;
                eduContainer.appendChild(card);
            });

            // Contact
            const contactList = document.getElementById('contact-info-list');
            contactList.innerHTML = `
                <li class="mb-3"><i class="fas fa-envelope me-2 text-primary"></i> <a href="mailto:${config.contact.email_primary}" class="text-white">${config.contact.email_primary}</a></li>
                <li class="mb-3"><i class="fas fa-envelope me-2 text-primary"></i> <a href="mailto:${config.contact.email_secondary}" class="text-white">${config.contact.email_secondary}</a></li>
                <li class="mb-3"><i class="fas fa-phone me-2 text-primary"></i> <a href="tel:${config.contact.phone.replace(/[\s-]/g, '')}" class="text-white">${config.contact.phone}</a></li>
                <li class="mb-3"><i class="fas fa-map-marker-alt me-2 text-primary"></i> <span>${config.contact.location}</span></li>
            `;


            // Particles
            particlesJS('particles-js', config.particles);

            // Hide Loader
            document.getElementById('console-loader').style.opacity = '0';
            setTimeout(function () {
                document.getElementById('console-loader').style.display = "none";
                document.getElementById('console-loader').className = document.getElementById('console-loader').className.replace("d-flex", "");
            }, 500);

            // Observe Animations
            observeAnimations();
        }

        function observeAnimations() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = 1;
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.experience-card').forEach(card => {
                card.style.opacity = 0;
                card.style.transform = 'translateY(20px)';
                card.style.transition = 'all 0.5s ease';
                observer.observe(card);
            });
        }

        function initCounters() {
            const counters = document.querySelectorAll('.counter');
            const speed = 200;

            counters.forEach(counter => {
                const target = +counter.getAttribute('data-target');
                let count = 0; // Start from 0
                const increment = target / speed;

                const updateCount = () => {
                    count += increment;
                    const newCount = Math.ceil(count);
                    if (newCount < target) {
                        counter.innerText = newCount;
                        requestAnimationFrame(updateCount);
                    } else {
                        counter.innerText = target.toLocaleString() + "+";
                    }
                };
                updateCount();
            });
        }

        // Theme Toggle Logic
        document.addEventListener('DOMContentLoaded', function () {
            // Theme toggle is hidden by default in CSS, if needed it can be re-enabled or controlled via config
            const themeToggle = document.getElementById('themeToggle');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            let currentTheme = prefersDark ? 'dark' : 'light';

            document.documentElement.setAttribute('data-theme', currentTheme);
            updateThemeIcon();

            themeToggle.addEventListener('click', function () {
                currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', currentTheme);
                updateThemeIcon();
            });

            function updateThemeIcon() {
                const icon = themeToggle.querySelector('i');
                if (currentTheme === 'dark') {
                    icon.classList.remove('fa-moon');
                    icon.classList.add('fa-sun');
                } else {
                    icon.classList.remove('fa-sun');
                    icon.classList.add('fa-moon');
                }
            }
        });

        // Contact form handling (Keep as is)
        document.getElementById('contactForm').addEventListener('submit', function (e) {
            e.preventDefault();
            Swal.fire({
                title: 'Message Sent!',
                text: 'Thank you for reaching out. I will get back to you soon.',
                icon: 'success',
                confirmButtonText: 'Great!',
                theme: "dark"
            });
            this.reset();
        });
    </script>
</body>

</html>
