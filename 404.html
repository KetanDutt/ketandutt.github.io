<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a0e">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <title>Page not found — Ketan Dutt</title>
  <script>
    try {
      const saved = localStorage.getItem('portfolio-theme');
      const preferred = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      const theme = saved === 'light' || saved === 'dark' ? saved : preferred;
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#080a0e' : '#f2f4f7';
    } catch (_) { /* The dark default remains available in private browsing. */ }
  </script>
</head>
<body class="error-page">
  <div class="atmosphere" aria-hidden="true">
    <span class="atmosphere-field field-a"></span>
    <span class="atmosphere-field field-b"></span>
    <span class="atmosphere-field field-c"></span>
    <span class="atmosphere-grain"></span>
  </div>

  <main class="error-shell glass">
    <span class="error-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M6.5 5.5h11a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z"/><path d="m8.5 14 2.3-2.3a1 1 0 0 1 1.4 0l3.3 3.3M14.5 11l1-1 3.8 3.8M9 9h.01"/></svg>
    </span>
    <p class="error-kicker">Error 404 · Level unavailable</p>
    <h1>Lost the level?</h1>
    <p>This route is not part of the current world, but the main quest and every project are still waiting.</p>
    <div class="error-actions">
      <a class="button button-primary" href="/">Return to portfolio <span class="arrow" aria-hidden="true">→</span></a>
      <a class="button button-secondary" href="https://github.com/KetanDutt" rel="noopener noreferrer">Visit GitHub <span class="arrow" aria-hidden="true">↗</span></a>
    </div>
  </main>
</body>
</html>
